name: Test — spack unit-test inside Pyodide shell

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run spack unit-test in simulated Pyodide shell
    runs-on: ubuntu-latest

    env:
      # Spack branch/tag to clone for testing (same default as deploy.yml)
      SPACK_VERSION: develop
      # Where the Spack clone (including lib/spack/spack/test/) will live
      SPACK_ROOT: /tmp/spack-src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Spack (full tree, including test files)
        run: |
          git clone --depth 1 --branch "${SPACK_VERSION}" \
              https://github.com/spack/spack.git "${SPACK_ROOT}"

      - name: Install Python test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout clingo

      - name: Clone spack-packages for spack spec test
        # Place the builtin package repository where repos.yaml expects it:
        #   $SPACK_ROOT/var/spack/repos/spack_repo/builtin
        # This overrides the default repos.yaml (which points to GitHub) so
        # that spack spec zlib can find the zlib, gcc, and gcc-runtime recipes
        # without network access.
        run: |
          git clone --depth 1 --branch develop \
              https://github.com/spack/spack-packages.git /tmp/spack-packages-src
          mkdir -p "${SPACK_ROOT}/var/spack/repos/spack_repo"
          cp -r /tmp/spack-packages-src/repos/spack_repo/builtin \
                "${SPACK_ROOT}/var/spack/repos/spack_repo/builtin"

      - name: Install Spack's Python dependencies
        # Install packages that Spack's unit tests import at collection time.
        # We install from Spack's own requirements file when available and fall
        # back to a minimal set.  Errors are non-fatal; missing extras just
        # cause individual tests to be skipped by pytest.
        run: |
          if [ -f "${SPACK_ROOT}/requirements.txt" ]; then
            pip install -r "${SPACK_ROOT}/requirements.txt" || true
          fi

      - name: Run tests
        run: |
          pytest tests/ -v --timeout=300
        env:
          SPACK_ROOT: ${{ env.SPACK_ROOT }}

  build-wheel:
    name: Build clingo Pyodide wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Pyodide version config
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/pyodide-versions.env >> "$GITHUB_ENV"

      - name: Verify Pyodide version sync with worker.js
        run: python3 scripts/check_pyodide_version_sync.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          # Pre-create the cache directory so the save step doesn't warn
          # "path does not exist" when the build fails before any ccache hit.
          mkdir -p ~/.ccache
          # Emscripten's exec_process uses os.execv (not execvp), which does NOT
          # search PATH.  Resolve ccache to its absolute path and export it so
          # that EM_COMPILER_WRAPPER contains a full path that os.execv can find.
          echo "EM_COMPILER_WRAPPER=$(which ccache)" >> "$GITHUB_ENV"

      - name: Restore ccache objects
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-${{ runner.os }}-
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-

      - name: Build clingo Pyodide wheel
        run: bash scripts/build_clingo_pyodide.sh

      - name: Verify wheel structure
        run: python3 scripts/test_clingo_wheel.py /tmp/clingo-wheel

      - name: Set up Node.js for Pyodide smoke test
        uses: actions/setup-node@v6
        with:
          # Node.js 22 has WebAssembly Exception Handling (EH) built in as a
          # standard feature (no --experimental-wasm-eh flag needed), which is
          # required to load the clingo WASM binary compiled with -fwasm-exceptions.
          node-version: '22'

      - name: Install pyodide for wheel smoke test
        run: |
          mkdir -p /tmp/pyodide-test
          npm install --prefix /tmp/pyodide-test pyodide@${{ env.PYODIDE_VERSION }}

      - name: Smoke-test clingo wheel in Pyodide (Node.js)
        run: |
          cp scripts/smoke_test_clingo_pyodide.mjs /tmp/pyodide-test/
          cd /tmp/pyodide-test && node smoke_test_clingo_pyodide.mjs /tmp/clingo-wheel

      - name: Upload clingo wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: clingo-wheel
          path: /tmp/clingo-wheel/*.whl
          if-no-files-found: error

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-${{ runner.os }}-${{ github.run_id }}

  browser-smoke:
    name: Browser smoke-test assembled site
    runs-on: ubuntu-latest
    needs: build-wheel
    env:
      SPACK_VERSION: develop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Pyodide version config
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/pyodide-versions.env >> "$GITHUB_ENV"

      - name: Verify Pyodide version sync with worker.js
        run: python3 scripts/check_pyodide_version_sync.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download clingo wheel artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: clingo-wheel
          path: /tmp/clingo-wheel

      - name: Build spack-lite.tar.gz
        run: bash scripts/make_spack_lite.sh

      - name: Assemble _site (deploy-like)
        run: |
          mkdir -p _site
          cp index.html      _site/
          cp worker.js       _site/
          cp shim_system.py  _site/
          cp shell.py        _site/
          cp spack-lite.tar.gz _site/
          shopt -s nullglob
          wheels=(/tmp/clingo-wheel/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel in /tmp/clingo-wheel, but found ${#wheels[@]}. Files: ${wheels[*]:-(none)}" >&2
            exit 1
          fi
          wheel_path="${wheels[0]}"
          wheel_name="$(basename "$wheel_path")"
          cp "$wheel_path" "_site/${wheel_name}"
          cp "$wheel_path" _site/clingo.whl
          printf '%s\n' "$wheel_name" > _site/clingo-wheel-name.txt

      - name: Set up Node.js for browser smoke test
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install browser smoke-test dependencies
        run: |
          mkdir -p /tmp/browser-smoke
          npm install --prefix /tmp/browser-smoke playwright@1.54.1
          npx --prefix /tmp/browser-smoke playwright install --with-deps chromium

      - name: Browser smoke-test assembled site
        run: |
          cp scripts/smoke_test_site_browser.mjs /tmp/browser-smoke/
          cd /tmp/browser-smoke && node smoke_test_site_browser.mjs "$GITHUB_WORKSPACE/_site"
