name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant the workflow the permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build spack-lite archive and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load Pyodide version config
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/pyodide-versions.env >> "$GITHUB_ENV"

      - name: Verify Pyodide version sync with worker.js
        run: python3 scripts/check_pyodide_version_sync.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python build dependencies
        run: pip install clingo

      - name: Build spack-lite.tar.gz
        env:
          # Use the Spack develop branch
          SPACK_VERSION: develop
        run: bash scripts/make_spack_lite.sh

      - name: Assemble site artefacts
        run: |
          mkdir -p _site
          cp index.html    _site/
          cp worker.js     _site/
          cp shim_system.py _site/
          cp shell.py      _site/
          cp spack-lite.tar.gz _site/
          cp spack-packages.tar.gz _site/
          SPACK_LITE_VERSION="$(git describe --tags --always --dirty)"
          sed -i "s|__SPACK_LITE_VERSION__|${SPACK_LITE_VERSION}|g" _site/index.html

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
