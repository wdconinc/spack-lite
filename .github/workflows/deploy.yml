name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant the workflow the permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build spack-lite archive and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build spack-lite.tar.gz
        env:
          # Use the Spack develop branch
          SPACK_VERSION: develop
        run: bash scripts/make_spack_lite.sh

      - name: Build clingo Pyodide wheel
        env:
          # Must match the Pyodide version pinned in worker.js (PYODIDE_CDN)
          PYODIDE_VERSION: "0.25.1"
          CLINGO_BRANCH: wip-20
        run: bash scripts/build_clingo_pyodide.sh

      - name: Assemble site artefacts
        run: |
          mkdir -p _site
          cp index.html    _site/
          cp worker.js     _site/
          cp shim_system.py _site/
          cp shell.py      _site/
          cp spack-lite.tar.gz _site/
          # Rename the wheel to a stable filename so worker.js can always
          # fetch it as 'clingo.whl' regardless of the exact version string.
          cp /tmp/clingo-wheel/*.whl _site/clingo.whl

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
