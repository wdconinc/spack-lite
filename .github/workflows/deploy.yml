name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant the workflow the permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build spack-lite archive and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Pyodide version config
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/pyodide-versions.env >> "$GITHUB_ENV"

      - name: Verify Pyodide version sync with worker.js
        run: python3 scripts/check_pyodide_version_sync.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build spack-lite.tar.gz
        env:
          # Use the Spack develop branch
          SPACK_VERSION: develop
        run: bash scripts/make_spack_lite.sh

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          # Pre-create the cache directory so the save step doesn't warn
          # "path does not exist" when the build fails before any ccache hit.
          mkdir -p ~/.ccache
          # Emscripten's exec_process uses os.execv (not execvp), which does NOT
          # search PATH.  Resolve ccache to its absolute path and export it so
          # that EM_COMPILER_WRAPPER contains a full path that os.execv can find.
          echo "EM_COMPILER_WRAPPER=$(which ccache)" >> "$GITHUB_ENV"

      - name: Restore ccache objects
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-${{ runner.os }}
          restore-keys: |
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-

      - name: Build clingo Pyodide wheel
        run: bash scripts/build_clingo_pyodide.sh

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-${{ runner.os }}

      - name: Assemble site artefacts
        run: |
          mkdir -p _site
          cp index.html    _site/
          cp worker.js     _site/
          cp shim_system.py _site/
          cp shell.py      _site/
          cp spack-lite.tar.gz _site/
          # Preserve the wheel basename so micropip can parse a valid wheel
          # filename when installing from URL.
          wheel_path="$(echo /tmp/clingo-wheel/*.whl)"
          wheel_name="$(basename "$wheel_path")"
          cp "$wheel_path" "_site/${wheel_name}"
          printf '%s\n' "$wheel_name" > _site/clingo-wheel-name.txt

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
