concretizer:
  # Do not attempt to reuse previously installed packages from the spack
  # database.  In the shimmed browser/Pyodide environment no packages are
  # actually installed, so reuse is always false.  More importantly, the
  # reuse check in spack develop (2025+) requires libc information for
  # compiler packages; our fake gcc stub cannot provide that, causing
  # "Cannot reuse gcc since we cannot determine libc compatibility".
  reuse: false
  # Pre-populated at build time by scripts/presolve_packages.py.
  # A cache hit skips the clingo load/ground/solve phases for seed packages,
  # significantly reducing solve time in the browser WASM environment.
  concretization_cache:
    enable: true
    url: $spack/var/spack/concretization_cache
