name: Test — spack unit-test inside Pyodide shell

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run spack unit-test in simulated Pyodide shell
    runs-on: ubuntu-latest

    env:
      # Spack branch/tag to clone for testing (same default as deploy.yml)
      SPACK_VERSION: develop
      # Where the Spack clone (including lib/spack/spack/test/) will live
      SPACK_ROOT: /tmp/spack-src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clone Spack (full tree, including test files)
        run: |
          git clone --depth 1 --branch "${SPACK_VERSION}" \
              https://github.com/spack/spack.git "${SPACK_ROOT}"

      - name: Install Python test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout clingo

      - name: Clone spack-packages for spack spec test
        # Place the builtin package repository where repos.yaml expects it:
        #   $SPACK_ROOT/var/spack/repos/spack_repo/builtin
        # This overrides the default repos.yaml (which points to GitHub) so
        # that spack spec zlib can find the zlib, gcc, and gcc-runtime recipes
        # without network access.
        #
        # IMPORTANT: copy only the seed packages listed in KEEP_PKGS (from
        # scripts/make_spack_lite.sh) so that test_spack_spec_zlib catches
        # missing transitive dependencies the same way a real browser session
        # would.  Copying all ~7,000 packages causes the clingo solver to hang
        # in the WASM environment and masks missing-package errors in CI.
        run: |
          git clone --depth 1 --branch develop \
              https://github.com/spack/spack-packages.git /tmp/spack-packages-src

          # Parse KEEP_PKGS from make_spack_lite.sh without eval:
          # extract lines between KEEP_PKGS=( and its closing ),
          # then filter to valid package name tokens (lowercase, digits, underscores).
          KEEP_PKGS=($(awk '/^KEEP_PKGS=\(/{found=1; next} found && /^\)/{exit} found{print}' \
            scripts/make_spack_lite.sh \
            | tr ' ' '\n' \
            | grep -E '^[a-z][a-z0-9_]*$'))

          SRC=/tmp/spack-packages-src/repos/spack_repo/builtin
          DST="${SPACK_ROOT}/var/spack/repos/spack_repo/builtin"
          mkdir -p "${DST}/packages"

          # Copy build_systems, __init__.py, and repo.yaml (required by API v2).
          for f in __init__.py repo.yaml; do
            [ -f "${SRC}/${f}" ] && cp "${SRC}/${f}" "${DST}/${f}"
          done
          [ -d "${SRC}/build_systems" ] && cp -r "${SRC}/build_systems" "${DST}/build_systems"

          # Copy only the seed packages so the test mirrors the browser environment.
          for pkg in "${KEEP_PKGS[@]}"; do
            if [ -d "${SRC}/packages/${pkg}" ]; then
              cp -r "${SRC}/packages/${pkg}" "${DST}/packages/${pkg}"
            else
              echo "WARNING: KEEP_PKGS package '${pkg}' not found in spack-packages source" >&2
            fi
          done

      - name: Install Spack's Python dependencies
        # Install packages that Spack's unit tests import at collection time.
        # We install from Spack's own requirements file when available and fall
        # back to a minimal set.  Errors are non-fatal; missing extras just
        # cause individual tests to be skipped by pytest.
        run: |
          if [ -f "${SPACK_ROOT}/requirements.txt" ]; then
            pip install -r "${SPACK_ROOT}/requirements.txt" || true
          fi

      - name: Run tests
        run: |
          pytest tests/ -v --timeout=300
        env:
          SPACK_ROOT: ${{ env.SPACK_ROOT }}

  browser-smoke:
    name: Browser smoke-test assembled site
    runs-on: ubuntu-latest
    env:
      SPACK_VERSION: develop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Pyodide version config
        run: grep -E "^[A-Za-z_][A-Za-z0-9_]*=" .github/pyodide-versions.env >> "$GITHUB_ENV"

      - name: Verify Pyodide version sync with worker.js
        run: python3 scripts/check_pyodide_version_sync.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python build dependencies
        run: pip install clingo

      - name: Build spack-lite.tar.gz
        run: bash scripts/make_spack_lite.sh

      - name: Assemble _site (deploy-like)
        run: |
          mkdir -p _site
          cp index.html      _site/
          cp worker.js       _site/
          cp shim_system.py  _site/
          cp shell.py        _site/
          cp spack-lite.tar.gz _site/
          cp spack-packages.tar.gz _site/
          SPACK_LITE_VERSION="$(git describe --tags --always --dirty)"
          sed -i "s|__SPACK_LITE_VERSION__|${SPACK_LITE_VERSION}|g" _site/index.html

      - name: Set up Node.js for browser smoke test
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install browser smoke-test dependencies
        run: |
          mkdir -p /tmp/browser-smoke
          npm install --prefix /tmp/browser-smoke playwright@1.54.1
          npx --prefix /tmp/browser-smoke playwright install --with-deps chromium

      - name: Browser smoke-test assembled site
        run: |
          cp scripts/smoke_test_site_browser.mjs /tmp/browser-smoke/
          cd /tmp/browser-smoke && node smoke_test_site_browser.mjs "$GITHUB_WORKSPACE/_site"
