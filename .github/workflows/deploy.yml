name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant the workflow the permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build spack-lite archive and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Pyodide version config
        run: cat .github/pyodide-versions.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build spack-lite.tar.gz
        env:
          # Use the Spack develop branch
          SPACK_VERSION: develop
        run: bash scripts/make_spack_lite.sh

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-${{ runner.os }}
          restore-keys: |
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-pyodide-${{ env.PYODIDE_VERSION }}-
            ccache-clingo-emscripten-${{ env.CLINGO_BRANCH }}-

      - name: Build clingo Pyodide wheel
        env:
          # Tell Emscripten to use ccache as the compiler wrapper so that
          # unchanged C/C++ translation units are served from cache on
          # repeated builds.
          EM_COMPILER_WRAPPER: ccache
        run: bash scripts/build_clingo_pyodide.sh

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Assemble site artefacts
        run: |
          mkdir -p _site
          cp index.html    _site/
          cp worker.js     _site/
          cp shim_system.py _site/
          cp shell.py      _site/
          cp spack-lite.tar.gz _site/
          # Copy the wheel to a stable filename so worker.js can always fetch
          # it as 'clingo.whl' regardless of the exact version string.
          # build_clingo_pyodide.sh guarantees exactly one .whl in the output dir.
          cp "$(echo /tmp/clingo-wheel/*.whl)" _site/clingo.whl

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
